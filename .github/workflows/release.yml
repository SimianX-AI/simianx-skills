name: release

# A tag `vX.Y.Z` publishes the skill: the tag must equal the version in every carrier (scripts/check_version.py),
# the 16 READMEs must agree (scripts/check_readmes.py), every manifest must parse, then the skill folder is zipped
# and attached to a GitHub release whose notes are the changelog section of that version. Pushes to main and pull
# requests only run the checks.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: versions agree
        run: python3 scripts/check_version.py ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - name: readmes agree
        run: python3 scripts/check_readmes.py
      - name: manifests parse
        run: |
          for f in plugin.json gemini-extension.json .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .cursor-plugin/plugin.json .cursor-plugin/marketplace.json .agents/plugins/marketplace.json \
                   server.json smithery.config-schema.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: scripts compile
        run: |
          python3 -m py_compile examples/runner/runner.py scripts/install.py scripts/check_version.py scripts/check_readmes.py
          sh -n scripts/install.sh
      - name: install script dry run
        run: |
          HOME=$(mktemp -d) python3 scripts/install.py --agent all --dry-run
          python3 scripts/install.py --agent codex --scope project --project-dir "$(mktemp -d)" --yes
      - name: skill frontmatter parses
        run: |
          python3 - <<'PY'
          import re, sys
          text = open("skills/simianx/SKILL.md", encoding="utf-8").read()
          head = text.split("---", 2)[1]
          for key in ("name:", "description:", "version:"):
              if key not in head:
                  sys.exit(f"SKILL.md frontmatter lacks {key}")
          m = re.search(r"^description:\s*(.+)$", head, re.M)
          if len(m.group(1)) > 1024:
              sys.exit("SKILL.md description over 1024 characters")
          if text.count("\n") > 500:
              sys.exit("SKILL.md over 500 lines")
          print("frontmatter ok")
          PY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package the skill
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd skills && zip -qr "../dist/simianx-skill-${VERSION}.zip" simianx -x '*/__pycache__/*' '*/.installed.json')
          cp skills/simianx/SKILL.md "dist/SKILL-${VERSION}.md"
          ls -l dist
      - name: release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($0 ~ "## \\[?v?" v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $VERSION" > dist/notes.md
          cat dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: simianx skill ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/*.zip
            dist/SKILL-*.md
